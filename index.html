<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RION CHAT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0b1020;color:#fff;min-height:100vh}
button,input{font:inherit}
.app{max-width:900px;margin:auto;min-height:100vh;background:#11182b}
header{padding:18px 20px;background:linear-gradient(135deg,#171f38,#0d1325);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29324d}
.logo{font-size:25px;font-weight:800;letter-spacing:2px}.logo span{color:#5ee7ff}
#userInfo{font-size:12px;color:#aeb8d0;max-width:180px;overflow:hidden}
main{padding:20px}
.card{background:#151e34;border:1px solid #293552;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 10px 35px #0003}
h2{margin-bottom:15px}
input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #35415f;background:#0d1426;color:#fff;outline:none;margin-bottom:10px}
input:focus{border-color:#5ee7ff}
button{border:0;border-radius:12px;padding:12px 17px;background:#5ee7ff;color:#07101a;font-weight:700;cursor:pointer}
button.secondary{background:#273451;color:#fff}
button.danger{background:#ff5364;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
#results{margin-top:15px}
.user{display:flex;align-items:center;justify-content:space-between;padding:13px;border-radius:13px;background:#0e1628;margin-top:9px;border:1px solid #26334e}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#243c62;color:#5ee7ff;font-weight:800;margin-right:10px}
.userLeft{display:flex;align-items:center;min-width:0}.userText{overflow:hidden}.userText b,.userText small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userText small{color:#8e9ab5;margin-top:4px}
.chat{display:none;height:calc(100vh - 150px);min-height:500px;flex-direction:column}
.chatTop{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #293552}
.messages{flex:1;overflow:auto;padding:15px 3px}
.msg{max-width:78%;padding:10px 13px;border-radius:15px;margin:8px 0;word-wrap:break-word}
.me{background:#216b7d;margin-left:auto;border-bottom-right-radius:4px}
.them{background:#273451;margin-right:auto;border-bottom-left-radius:4px}
.time{font-size:10px;color:#b9c5d9;margin-top:4px;opacity:.7}
.send{display:flex;gap:8px;padding-top:10px}.send input{margin:0}.send button{width:58px}
#status{font-size:13px;color:#9eabc5;margin-top:10px;min-height:18px}
.hidden{display:none!important}
.note{font-size:12px;color:#8491ad;line-height:1.5;margin-top:12px}
@media(max-width:600px){main{padding:12px}.card{padding:15px}.chat{height:calc(100vh - 120px);min-height:450px}.msg{max-width:86%}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">RION <span>CHAT</span></div>
  <div id="userInfo">Not logged in</div>
</header>

<main>
<section id="authCard" class="card">
  <h2>🔐 Login / Account</h2>
  <input id="email" type="email" placeholder="Gmail / Email">
  <input id="password" type="password" placeholder="Password (email account)">
  <div class="row">
    <button id="signupBtn">Create account</button>
    <button id="loginBtn" class="secondary">Login</button>
  </div>
  <hr style="border:0;border-top:1px solid #293552;margin:18px 0">
  <input id="phone" type="tel" placeholder="+8801XXXXXXXXX">
  <div id="recaptcha-container"></div>
  <button id="phoneBtn" class="secondary">Send phone OTP</button>
  <input id="otp" class="hidden" type="text" placeholder="OTP code">
  <button id="verifyBtn" class="hidden">Verify OTP</button>
  <p class="note">Phone login চালাতে Firebase Authentication-এ Phone provider এবং reCAPTCHA লাগবে।</p>
  <div id="authStatus"></div>
</section>

<section id="homeCard" class="card hidden">
  <h2>🔎 Find a person</h2>
  <input id="search" placeholder="Gmail অথবা phone number লিখুন">
  <button id="searchBtn">Search user</button>
  <div id="results"></div>
  <div class="row" style="margin-top:15px"><button id="logoutBtn" class="danger">Logout</button></div>
  <p class="note">শুধু যেসব user এই app-এ account খুলেছে তাদেরই এখানে পাওয়া যাবে।</p>
</section>

<section id="chatCard" class="card chat">
  <div class="chatTop">
    <button id="backBtn" class="secondary">←</button>
    <div>
      <b id="chatName">Chat</b><br>
      <small id="chatContact" style="color:#8e9ab5"></small>
    </div>
  </div>
  <div id="messages" class="messages"></div>
  <div class="send">
    <input id="messageInput" placeholder="Message লিখুন...">
    <button id="sendBtn">➤</button>
  </div>
</section>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, collection, query, where,
  getDocs, addDoc, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* =========================================================
   STEP 1: Firebase Console > Project settings > Your apps
   থেকে আপনার firebaseConfig এখানে বসান।
   ========================================================= */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let selectedUser = null;
let unsubscribeMessages = null;
let confirmationResult = null;
let recaptchaVerifier = null;

const $ = id => document.getElementById(id);
const normPhone = p => (p || "").replace(/[^\d+]/g,"");
const status = (el,msg) => $(el).textContent = msg;

$("signupBtn").onclick = async () => {
  try {
    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;
    if(!email || !password) return status("authStatus","Email ও password দিন।");
    const cred = await createUserWithEmailAndPassword(auth,email,password);
    await saveProfile(cred.user);
    status("authStatus","Account তৈরি হয়েছে।");
  } catch(e){ status("authStatus",friendlyError(e)); }
};

$("loginBtn").onclick = async () => {
  try {
    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;
    const cred = await signInWithEmailAndPassword(auth,email,password);
    await saveProfile(cred.user);
  } catch(e){ status("authStatus",friendlyError(e)); }
};

$("phoneBtn").onclick = async () => {
  try {
    const phone = normPhone($("phone").value.trim());
    if(!phone) return status("authStatus","Phone number দিন।");
    if(!recaptchaVerifier){
      recaptchaVerifier = new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
      await recaptchaVerifier.render();
    }
    confirmationResult = await signInWithPhoneNumber(auth,phone,recaptchaVerifier);
    $("otp").classList.remove("hidden");
    $("verifyBtn").classList.remove("hidden");
    status("authStatus","OTP পাঠানো হয়েছে।");
  } catch(e){
    status("authStatus",friendlyError(e));
    if(recaptchaVerifier){ try{await recaptchaVerifier.clear();}catch(_){} recaptchaVerifier=null; }
  }
};

$("verifyBtn").onclick = async () => {
  try{
    if(!confirmationResult) return status("authStatus","আগে OTP পাঠান।");
    const cred = await confirmationResult.confirm($("otp").value.trim());
    await saveProfile(cred.user);
  }catch(e){ status("authStatus",friendlyError(e)); }
};

async function saveProfile(user){
  const ref = doc(db,"users",user.uid);
  const old = await getDoc(ref);
  const data = {
    uid:user.uid,
    email:(user.email||"").toLowerCase(),
    phone:user.phoneNumber||"",
    updatedAt:serverTimestamp()
  };
  if(!old.exists()) data.createdAt=serverTimestamp();
  await setDoc(ref,data,{merge:true});
}

onAuthStateChanged(auth, async user => {
  currentUser=user;
  if(user){
    await saveProfile(user);
    $("authCard").classList.add("hidden");
    $("homeCard").classList.remove("hidden");
    $("userInfo").textContent=user.email || user.phoneNumber || "Logged in";
  }else{
    $("authCard").classList.remove("hidden");
    $("homeCard").classList.add("hidden");
    $("chatCard").style.display="none";
    $("userInfo").textContent="Not logged in";
  }
});

$("searchBtn").onclick = searchUsers;
$("search").addEventListener("keydown",e=>{if(e.key==="Enter")searchUsers()});

async function searchUsers(){
  if(!currentUser)return;
  const term=$("search").value.trim().toLowerCase();
  if(!term)return $("results").innerHTML="<p class='note'>Gmail বা phone number লিখুন।</p>";
  $("results").innerHTML="<p class='note'>Searching...</p>";
  try{
    const found=[];
    const emailSnap=await getDocs(query(collection(db,"users"),where("email","==",term)));
    emailSnap.forEach(d=>found.push(d.data()));

    const phone=normPhone(term);
    if(phone){
      const phoneSnap=await getDocs(query(collection(db,"users"),where("phone","==",phone)));
      phoneSnap.forEach(d=>{
        if(!found.some(x=>x.uid===d.data().uid))found.push(d.data());
      });
    }
    const others=found.filter(x=>x.uid!==currentUser.uid);
    if(!others.length){
      $("results").innerHTML="<p class='note'>এই তথ্য দিয়ে কোনো registered user পাওয়া যায়নি।</p>";
      return;
    }
    $("results").innerHTML=others.map(u=>`
      <div class="user">
        <div class="userLeft">
          <div class="avatar">${((u.email||u.phone||"?")[0]).toUpperCase()}</div>
          <div class="userText">
            <b>${escapeHtml(u.email||u.phone||"User")}</b>
            <small>${escapeHtml(u.phone||"")}</small>
          </div>
        </div>
        <button data-uid="${u.uid}">Message</button>
      </div>`).join("");
    document.querySelectorAll(".user button").forEach(b=>b.onclick=()=>openChat(b.dataset.uid));
  }catch(e){
    $("results").innerHTML="<p class='note'>Search error: "+escapeHtml(friendlyError(e))+"</p>";
  }
}

async function openChat(uid){
  const snap=await getDoc(doc(db,"users",uid));
  if(!snap.exists())return;
  selectedUser=snap.data();
  $("homeCard").classList.add("hidden");
  $("chatCard").style.display="flex";
  $("chatName").textContent=selectedUser.email||selectedUser.phone||"User";
  $("chatContact").textContent=selectedUser.phone||selectedUser.email||"";
  listenMessages();
}

function chatId(a,b){ return [a,b].sort().join("_"); }

function listenMessages(){
  if(unsubscribeMessages)unsubscribeMessages();
  const id=chatId(currentUser.uid,selectedUser.uid);
  const q=query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc"));
  unsubscribeMessages=onSnapshot(q,snap=>{
    $("messages").innerHTML="";
    snap.forEach(d=>{
      const m=d.data();
      const div=document.createElement("div");
      div.className="msg "+(m.senderId===currentUser.uid?"me":"them");
      div.innerHTML=escapeHtml(m.text||"")+"<div class='time'>"+formatTime(m.createdAt)+"</div>";
      $("messages").appendChild(div);
    });
    $("messages").scrollTop=$("messages").scrollHeight;
  });
}

$("sendBtn").onclick=sendMessage;
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

async function sendMessage(){
  const text=$("messageInput").value.trim();
  if(!text||!selectedUser)return;
  const id=chatId(currentUser.uid,selectedUser.uid);
  $("messageInput").value="";
  await addDoc(collection(db,"chats",id,"messages"),{
    text,
    senderId:currentUser.uid,
    receiverId:selectedUser.uid,
    createdAt:serverTimestamp()
  });
}

$("backBtn").onclick=()=>{
  if(unsubscribeMessages)unsubscribeMessages();
  $("chatCard").style.display="none";
  $("homeCard").classList.remove("hidden");
  selectedUser=null;
};

$("logoutBtn").onclick=()=>signOut(auth);

function formatTime(ts){
  if(!ts||!ts.toDate)return "";
  return ts.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function friendlyError(e){
  const map={
    "auth/email-already-in-use":"এই email দিয়ে account আগে থেকেই আছে।",
    "auth/invalid-credential":"Email/password সঠিক নয়।",
    "auth/weak-password":"Password কমপক্ষে 6 characters দিন।",
    "auth/invalid-phone-number":"Phone number সঠিক নয়।",
    "auth/too-many-requests":"অনেকবার চেষ্টা হয়েছে। পরে আবার চেষ্টা করুন।",
    "auth/invalid-verification-code":"OTP সঠিক নয়।"
  };
  return map[e.code] || e.message || "একটি সমস্যা হয়েছে।";
}
</script>
</body>
</html>
